<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orquestrador — Chat</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2028;
      --panel-2: #232b36;
      --border: #2d3644;
      --text: #e6edf3;
      --muted: #8b98a5;
      --accent: #4f9dff;
      --user: #2b5cff;
      --assistant: #2a3542;
      --danger: #ff6b6b;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    header h1 {
      font-size: 14px;
      margin: 0;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    header .agents {
      font-size: 12px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 60%;
    }
    header button {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    header button:hover { color: var(--text); border-color: var(--accent); }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
    }
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 10px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 14px;
    }
    .msg.user { align-self: flex-end; background: var(--user); color: white; }
    .msg.assistant { align-self: flex-start; background: var(--assistant); }
    .msg.system { align-self: center; background: transparent; color: var(--muted); font-size: 12px; font-style: italic; }
    .msg.error { align-self: center; background: transparent; color: var(--danger); font-size: 13px; }
    .msg .meta { font-size: 11px; color: var(--muted); margin-top: 6px; }
    .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
    .typing span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--muted);
      animation: blink 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }
    form {
      display: flex;
      gap: 8px;
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      background: var(--panel);
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
    }
    textarea {
      flex: 1;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font: inherit;
      font-size: 14px;
      resize: none;
      min-height: 42px;
      max-height: 200px;
      line-height: 1.4;
    }
    textarea:focus { outline: none; border-color: var(--accent); }
    button.send {
      background: var(--accent);
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 0 20px;
      font-weight: 600;
      cursor: pointer;
    }
    button.send:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>🤖 Orquestrador</h1>
    <div class="agents" id="agents">carregando agentes…</div>
    <button id="reset" title="Reinicia o contexto da conversa">reset</button>
  </header>

  <div id="messages"></div>

  <form id="form">
    <textarea id="input" placeholder="Pergunte algo… (Enter envia, Shift+Enter quebra linha)" autofocus></textarea>
    <button type="submit" class="send" id="send">Enviar</button>
  </form>

  <script>
    // URL da API do orquestrador. Ordem de prioridade:
    //   1. ?api=... na querystring
    //   2. window.ORCHESTRATOR_API (definido em config.js opcional)
    //   3. default http://localhost:8400
    const API = new URLSearchParams(location.search).get("api")
      || window.ORCHESTRATOR_API
      || "http://localhost:8400";

    const $messages = document.getElementById("messages");
    const $agents = document.getElementById("agents");
    const $form = document.getElementById("form");
    const $input = document.getElementById("input");
    const $send = document.getElementById("send");
    const $reset = document.getElementById("reset");

    function addMsg(role, text, meta) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;
      if (meta) {
        const m = document.createElement("div");
        m.className = "meta";
        m.textContent = meta;
        div.appendChild(m);
      }
      $messages.appendChild(div);
      $messages.scrollTop = $messages.scrollHeight;
      return div;
    }

    function addTyping() {
      const div = document.createElement("div");
      div.className = "msg assistant";
      div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
      $messages.appendChild(div);
      $messages.scrollTop = $messages.scrollHeight;
      return div;
    }

    async function loadAgents() {
      try {
        const r = await fetch(`${API}/api/agents`);
        const list = await r.json();
        if (!list.length) {
          $agents.textContent = "nenhum agente A2A conectado";
          return;
        }
        $agents.textContent = list.map(a => a.name).join(" · ");
        $agents.title = list.map(a => `${a.name} — ${a.url}`).join("\n");
      } catch (e) {
        $agents.textContent = "erro ao descobrir agentes";
      }
    }

    async function sendMessage(text) {
      addMsg("user", text);
      const typing = addTyping();
      $send.disabled = true;
      try {
        const r = await fetch(`${API}/api/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text }),
        });
        typing.remove();
        if (!r.ok) {
          const err = await r.text();
          addMsg("error", `erro (${r.status}): ${err}`);
          return;
        }
        const data = await r.json();
        const meta = data.cost_usd != null ? `custo: US$ ${data.cost_usd.toFixed(6)}` : null;
        addMsg("assistant", data.reply || "(resposta vazia)", meta);
      } catch (e) {
        typing.remove();
        addMsg("error", `falha de rede: ${e.message}`);
      } finally {
        $send.disabled = false;
        $input.focus();
      }
    }

    $form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = $input.value.trim();
      if (!text) return;
      $input.value = "";
      $input.style.height = "auto";
      sendMessage(text);
    });

    $input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        $form.requestSubmit();
      }
    });

    $input.addEventListener("input", () => {
      $input.style.height = "auto";
      $input.style.height = Math.min($input.scrollHeight, 200) + "px";
    });

    $reset.addEventListener("click", async () => {
      await fetch(`${API}/api/reset`, { method: "POST" });
      $messages.innerHTML = "";
      addMsg("system", "sessão reiniciada");
    });

    loadAgents();
    addMsg("system", "Conectado ao orquestrador. Faça uma pergunta.");
  </script>
</body>
</html>
