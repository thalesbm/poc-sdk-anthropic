[project]
name = "a2a-common"
version = "0.1.0"
description = "Modelos + servidor + cliente para o protocolo A2A (Google Agent2Agent, JSON-RPC 2.0)."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["a2a_common*"]
